<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>GGGS | Study Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="Gmas/TemplateData/favicon.ico">
<link rel="stylesheet" href="Gmas/TemplateData/style.css">

<script>
  const isGGGSPlayer =
    new URLSearchParams(location.search).get("gggsPlayer") === "1";

  document.documentElement.classList.add(
    isGGGSPlayer ? "player-mode" : "hub-mode"
  );
</script>

<style>
  :root {
    color-scheme: dark;
    --surface: #141721;
    --panel: #1c2030;
    --line: #30364a;
    --text: #f1f3fb;
    --muted: #a1abc2;
    --accent: #b7a1ff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    background: #10121b;
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  [hidden] {
    display: none !important;
  }

  .hub-mode #game-root,
  .player-mode #gggs-browser {
    display: none;
  }

  #gggs-browser {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .browser-top {
    background: #10131d;
    border-bottom: 1px solid var(--line);
  }

  .tab-strip {
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 16px 0;
  }

  .brand {
    padding: 0 12px 8px 0;
    color: var(--accent);
    font-size: 14px;
    font-weight: 850;
    letter-spacing: 2px;
  }

  #browser-tabs {
    display: flex;
    align-self: stretch;
    gap: 6px;
    overflow-x: auto;
    flex: 1;
  }

  .browser-tab {
    display: flex;
    align-items: center;
    min-width: 150px;
    max-width: 230px;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    background: #181c29;
  }

  .browser-tab.active {
    background: #252b3c;
    border-color: var(--line);
  }

  .tab-select {
    flex: 1;
    min-width: 0;
    padding: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
  }

  .tab-select,
  .tab-close {
    border: none;
    background: transparent;
    color: var(--text);
  }

  .tab-close {
    padding: 8px 12px;
    color: var(--muted);
  }

  .tab-close:hover {
    color: white;
  }

  .quiet-button {
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    background: #202536;
  }

  .quiet-button:hover {
    background: #30374d;
  }

  .quiet-button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 11px 16px;
    background: #252b3c;
  }

  #address-form {
    flex: 1;
    min-width: 0;
  }

  #browser-address {
    width: 100%;
    border: 1px solid #39425b;
    border-radius: 10px;
    background: #141925;
    color: #e1e5f5;
    padding: 11px 16px;
  }

  #browser-views {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  .browser-view {
    height: 100%;
    overflow: auto;
    background:
      radial-gradient(ellipse at 75% 0%, #282140 0%, transparent 55%),
      #10121b;
  }

  .page-content {
    max-width: 1200px;
    margin: auto;
    padding: 64px 36px;
  }

  .landing-logo {
  display: block;
  width: clamp(160px, 28vw, 320px);
  max-width: 100%;
  height: auto;
  margin: 0 0 24px;
  object-fit: contain;
}

.eyebrow {
    color: var(--accent);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .page-content h1 {
    margin: 16px 0;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 1.04;
    letter-spacing: -2px;
  }

  .page-description {
    max-width: 620px;
    margin-bottom: 30px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.7;
  }

  .library-search {
    width: 100%;
    margin: 0 0 30px;
    padding: 16px 19px;
    border: 1px solid var(--line);
    border-radius: 13px;
    color: var(--text);
    background: #191d2b;
  }

.library-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}

  .library-card {
    display: block;
    padding: 0;
    overflow: hidden;
    text-align: left;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #1b2030;
    transition: transform 160ms ease, border-color 160ms ease;
  }

  .library-card:hover {
    transform: translateY(-4px);
    border-color: #9b85e0;
  }

  .card-art {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    background: #292e41;
  }

.card-copy {
  display: block;
  padding: 12px;
}

.card-title {
  display: block;
  margin: 0;
  font-size: 14px;
  font-weight: 750;
  line-height: 1.4;
}

.card-description {
  display: none;
}

  .app-art {
    display: flex;
    align-items: flex-end;
    padding: 26px;
    color: #ece7ff;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #393052, #222b45);
  }

  .focus-art {
    background: linear-gradient(135deg, #234344, #222b45);
  }

  .subject-heading {
    margin: 38px 0 18px;
    font-size: 19px;
  }

  .notes-editor {
    display: block;
    width: 100%;
    min-height: 45vh;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    background: #191e2b;
    color: var(--text);
    line-height: 1.8;
  }

  .timer-display {
    margin: 36px 0;
    font-size: clamp(70px, 16vw, 150px);
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    letter-spacing: -5px;
  }

  .timer-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .game-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
  }

  .player-mode body {
    overflow: hidden;
    background: #000;
  }

  .player-mode #game-root {
    width: 100%;
    height: 100dvh;
  }

  .player-mode #unity-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: none;
  }

  .player-mode #unity-canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .player-mode #loading-text {
    position: fixed;
    inset: 20px 16px auto;
    z-index: 10;
    margin: 0 !important;
    padding: 16px;
    border-radius: 12px;
    background: #151925;
    color: #fff !important;
    font: 16px/1.6 system-ui, sans-serif !important;
  }

  @media (max-width: 650px) {
    .brand {
      display: none;
    }

    .toolbar {
      flex-wrap: wrap;
    }

    #address-form {
      order: 2;
      flex-basis: 100%;
    }

    .page-content {
      padding: 38px 20px;
    }

    .library-grid {
  grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
  gap: 10px;
}
  }

  @media (prefers-reduced-motion: reduce) {
    .library-card {
      transition: none;
    }
  }
</style>

  </head>
<body>
  <div id="gggs-browser">
    <header class="browser-top">
      <div class="tab-strip">
        <div class="brand">GGGS</div>
        <div id="browser-tabs" role="tablist" aria-label="Open pages"></div>
        <button id="new-tab" class="quiet-button" type="button">
          New tab
        </button>
      </div>

      <nav class="toolbar" aria-label="Browser navigation">
        <button id="nav-back" class="quiet-button" type="button">
          Back
        </button>
        <button id="nav-forward" class="quiet-button" type="button">
          Forward
        </button>
        <button id="nav-reload" class="quiet-button" type="button">
          Reload
        </button>

        <form id="address-form">
          <input
            id="browser-address"
            aria-label="Internal address"
            autocomplete="off"
            spellcheck="false"
            value="gggs://landing"
          >
        </form>

        <button
          class="quiet-button"
          type="button"
          data-navigate="gggs://landing"
        >
          Home
        </button>
      </nav>
    </header>

    <main id="browser-views"></main>
  </div>

  <div id="game-root">
        <div
      id="loading-text"
      style="
        color: black;
        font-size: 48px;
        font-family: cursive;
        text-align: center;
        margin-top: 20px;
      "
    >
      LOADING...
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

</div>

<script>
const gamse = "G" + "a" + "m" + "e" + "s";
const gamse2 = "g" + "a" + "m" + "e" + "s";
  if (!isGGGSPlayer) {
    initializeGGGS();
  }

  function initializeGGGS() {
    const tabStrip = document.querySelector("#browser-tabs");
    const views = document.querySelector("#browser-views");
    const address = document.querySelector("#browser-address");
    const backButton = document.querySelector("#nav-back");
    const forwardButton = document.querySelector("#nav-forward");

    const tabs = [];
    let activeId = null;
    let nextId = 1;

const titles = {
  "gggs://landing": "Home",
  [`gggs://${gamse2}`]: "Gāmes",
  "gggs://apps": "Apps",
  [`gggs://${gamse2}/baldi-plus`]: "Baldi's Basics Plus",
  [`gggs://${gamse2}/drive-mad`]: "Drive Mad",
  "gggs://apps/notes": "Notes",
  "gggs://apps/focus": "Focus Timer"
};


const catalog = [
  {
    title: "Baldi's Basics Plus",
    description: "Open Baldi's Basics Plus.",
    route: `gggs://${gamse2}/baldi-plus`,
    category: gamse2,
    image: "https://files.catbox.moe/hnml4f.webp"
  },
{
  title: "Drive Mad",
  description: "Open Drive Mad.",
  route: `gggs://${gamse2}/drive-mad`,
  category: gamse2,
  image: "https://files.catbox.moe/8ypaas.jpeg"
},
      {
        title: "Notes",
        description: "A quiet space for ideas and class notes.",
        route: "gggs://apps/notes",
        category: "apps",
        artClass: "",
        artLabel: "Aa"
      },
      {
        title: "Focus Timer",
        description: "A 25-minute session, one task at a time.",
        route: "gggs://apps/focus",
        category: "apps",
        artClass: "focus-art",
        artLabel: "25:00"
      }
    ];

    function currentTab() {
      return tabs.find((tab) => tab.id === activeId);
    }

    function currentRoute(tab) {
      return tab.history[tab.index];
    }

    function updateChrome() {
      tabStrip.replaceChildren();

      for (const tab of tabs) {
        const active = tab.id === activeId;
        tab.view.hidden = !active;

        const wrapper = document.createElement("div");
        wrapper.className = "browser-tab" + (active ? " active" : "");

        const select = document.createElement("button");
        select.type = "button";
        select.className = "tab-select";
        select.setAttribute("role", "tab");
        select.setAttribute("aria-selected", String(active));

const tabRoute = currentRoute(tab);
select.textContent = titles[tabRoute] || `Missing title: ${tabRoute}`;
select.title = tabRoute;

if (!titles[tabRoute]) {
  console.warn("Missing tab title for route:", tabRoute);
}

select.addEventListener("click", () => {
  activeId = tab.id;
  updateChrome();
});

        const close = document.createElement("button");
        close.type = "button";
        close.className = "tab-close";
        close.textContent = "×";
        close.setAttribute("aria-label", `Close ${select.textContent}`);
        close.addEventListener("click", () => closeTab(tab.id));

        wrapper.append(select, close);
        tabStrip.append(wrapper);
      }

      const active = currentTab();
      address.value = currentRoute(active);
      backButton.disabled = active.index === 0;
      forwardButton.disabled = active.index === active.history.length - 1;
    }

    function openTab(route, activate = true) {
      const view = document.createElement("section");
      view.className = "browser-view";
      views.append(view);

      const tab = {
        id: nextId++,
        history: [route],
        index: 0,
        view,
        cleanup: null
      };

      tabs.push(tab);

      if (activate || activeId === null) {
        activeId = tab.id;
      }

      renderPage(tab);
      updateChrome();
    }

    function closeTab(id) {
      const index = tabs.findIndex((tab) => tab.id === id);
      if (index === -1) return;

      const tab = tabs[index];
      if (tab.cleanup) tab.cleanup();
      tab.view.remove();
      tabs.splice(index, 1);

      if (!tabs.length) {
        openTab("gggs://landing");
        return;
      }

      if (activeId === id) {
        activeId = tabs[Math.min(index, tabs.length - 1)].id;
      }

      updateChrome();
    }

    function navigate(route) {
      const tab = currentTab();
      if (currentRoute(tab) === route) return;

      tab.history = tab.history.slice(0, tab.index + 1);
      tab.history.push(route);
      tab.index++;
      renderPage(tab);
      updateChrome();
    }

    function pageHeader(kicker, heading, description) {
      const content = document.createElement("div");
      content.className = "page-content";

const eyebrow = document.createElement(
  kicker === "Goo Goo Gaga Santa" ? "img" : "div"
);

if (kicker === "Goo Goo Gaga Santa") {
  eyebrow.className = "landing-logo";
  eyebrow.src = "https://files.catbox.moe/89bw5m.png";
  eyebrow.alt = "Goo Goo Gaga Santa gms";
} else {
  eyebrow.className = "eyebrow";
  eyebrow.textContent = kicker;
}

      const title = document.createElement("h1");
      title.textContent = heading;

      const copy = document.createElement("p");
      copy.className = "page-description";
      copy.textContent = description;

      content.append(eyebrow, title, copy);
      return content;
    }

    function makeCard(item) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "library-card";
      card.dataset.search = item.title.toLowerCase();

      if (item.image) {
        const image = document.createElement("img");
        image.className = "card-art";
        image.src = item.image;
        image.alt = item.title;
        image.loading = "lazy";
        card.append(image);
      } else {
        const art = document.createElement("span");
        art.className = `card-art app-art ${item.artClass || ""}`;
        art.textContent = item.artLabel || item.title;
        card.append(art);
      }

      const copy = document.createElement("span");
      copy.className = "card-copy";

      const title = document.createElement("span");
      title.className = "card-title";
      title.textContent = item.title;

      const description = document.createElement("span");
      description.className = "card-description";
      description.textContent = item.description;

      copy.append(title, description);
      card.append(copy);

      card.addEventListener("click", () => {
        const existing = tabs.find(
          (tab) => currentRoute(tab) === item.route
        );

        if (existing) {
          activeId = existing.id;
          updateChrome();
        } else {
          openTab(item.route);
        }
      });

      return card;
    }

    function addGrid(content, items) {
      const grid = document.createElement("div");
      grid.className = "library-grid";
      items.forEach((item) => grid.append(makeCard(item)));
      content.append(grid);
      return grid;
    }

    function addSearch(content, grid) {
      const input = document.createElement("input");
      input.className = "library-search";
      input.placeholder = "Search this collection";
      input.setAttribute("aria-label", "Search collection");

      input.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();

        for (const card of grid.children) {
          card.hidden = !card.dataset.search.includes(query);
        }
      });

      content.insertBefore(input, grid);
    }

    function renderPage(tab) {
      if (tab.cleanup) tab.cleanup();
      tab.cleanup = null;
      tab.view.replaceChildren();

      const route = currentRoute(tab);

if (route === `gggs://${gamse2}/drive-mad`) {
  const frame = document.createElement("iframe");

  frame.className = "game-frame";
  frame.title = "Drive Mad";
  frame.allow = "fullscreen; autoplay; gamepad";
  frame.allowFullscreen = true;

  frame.src = new URL(
    "Gmas/DriveMad/drivemad.html",
    document.baseURI
  ).href;

  tab.view.append(frame);
  return;
}

      if (route === `gggs://${gamse2}/baldi-plus`) {
        const frame = document.createElement("iframe");
        frame.className = "game-frame";
        frame.title = "Baldi's Basics Plus";
        frame.allow = "fullscreen; autoplay; gamepad";
        frame.allowFullscreen = true;

        const playerURL = new URL(location.href);
        playerURL.search = "";
        playerURL.hash = "";
        playerURL.searchParams.set("gggsPlayer", "1");
        frame.src = playerURL.href;

        tab.view.append(frame);
        return;
      }

      if (route === "gggs://apps/notes") {
        const content = pageHeader(
          "Language Arts",
          "Room to think.",
          "Notes stay here while this page remains open."
        );

        const editor = document.createElement("textarea");
        editor.className = "notes-editor";
        editor.placeholder = "Start writing...";
        editor.setAttribute("aria-label", "Your notes");

        try {
          editor.value = localStorage.getItem("gggs-notes") || "";
          content.querySelector(".page-description").textContent =
            "Notes save in this browser when local storage is available.";
        } catch {
          // The editor still works if storage is unavailable.
        }

        editor.addEventListener("input", () => {
          try {
            localStorage.setItem("gggs-notes", editor.value);
          } catch {
            content.querySelector(".page-description").textContent =
              "Storage is unavailable. Keep this page open to retain your notes.";
          }
        });

        content.append(editor);
        tab.view.append(content);
        return;
      }

      if (route === "gggs://apps/focus") {
        const content = pageHeader(
          "Study Hall",
          "One thing at a time.",
          "Settle into a 25-minute focus session."
        );

        const display = document.createElement("div");
        display.className = "timer-display";

        const controls = document.createElement("div");
        controls.className = "timer-controls";

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "quiet-button";
        toggle.textContent = "Start";

        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "quiet-button";
        reset.textContent = "Reset";

        let remaining = 25 * 60;
        let deadline = null;

        function updateTimer() {
          if (deadline !== null) {
            remaining = Math.max(
              0,
              Math.ceil((deadline - Date.now()) / 1000)
            );

            if (remaining === 0) {
              deadline = null;
              toggle.textContent = "Start";
              content.querySelector(".page-description").textContent =
                "Session complete. Take a breather.";
            }
          }

          const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
          const seconds = String(remaining % 60).padStart(2, "0");
          display.textContent = `${minutes}:${seconds}`;
        }

        toggle.addEventListener("click", () => {
          updateTimer();

          if (deadline !== null) {
            deadline = null;
            toggle.textContent = "Resume";
          } else {
            if (remaining === 0) remaining = 25 * 60;
            deadline = Date.now() + remaining * 1000;
            toggle.textContent = "Pause";
          }

          updateTimer();
        });

        reset.addEventListener("click", () => {
          deadline = null;
          remaining = 25 * 60;
          toggle.textContent = "Start";
          updateTimer();
        });

        const interval = setInterval(updateTimer, 250);
        tab.cleanup = () => clearInterval(interval);

        controls.append(toggle, reset);
        content.append(display, controls);
        tab.view.append(content);
        updateTimer();
        return;
      }

      if (route === "gggs://landing") {
        const content = pageHeader(
"Goo Goo Gaga Santa",
"V2 is here.",
""
        );

        addGrid(content, [
          {
            title: "Gāmes",
            description: "Explore your interactive collection.",
            route: `gggs://${gamse2}`,
            artLabel: "Gāmes"
          },
          {
            title: "Apps",
            description: "Small tools for your next big idea.",
            route: "gggs://apps",
            artLabel: "Apps",
            artClass: "focus-art"
          }
        ]);

        
        
        tab.view.append(content);
        return;
      }

      if (route === `gggs://${gamse2}` || route === "gggs://apps") {
  const gms = route === `gggs://${gamse2}`;
        const content = pageHeader(
          gms ? "Gāmes" : "Study Lab",
          gms ? "Find your next favorite." : "Make room for ideas.",
          gms
            ? "Your game collection, all in one place."
            : "Useful tools, without the clutter."
        );

        
        const grid = addGrid(
  content,
  catalog.filter((item) => {
    return item.category === (gms ? gamse2 : "apps");
  })
);

        addSearch(content, grid);
        tab.view.append(content);
        return;
      }

      tab.view.append(
        pageHeader(
          "Unknown address",
          "This page isn't here.",
          "Try gggs://landing, gggs://gms, or gggs://apps."
        )
      );
    }

    document.querySelector("#new-tab").addEventListener("click", () => {
      openTab("gggs://landing");
    });

    document.querySelector("#address-form").addEventListener("submit", (event) => {
      event.preventDefault();
      navigate(address.value.trim().toLowerCase());
    });

    backButton.addEventListener("click", () => {
      const tab = currentTab();
      if (tab.index === 0) return;
      tab.index--;
      renderPage(tab);
      updateChrome();
    });

    forwardButton.addEventListener("click", () => {
      const tab = currentTab();
      if (tab.index >= tab.history.length - 1) return;
      tab.index++;
      renderPage(tab);
      updateChrome();
    });
